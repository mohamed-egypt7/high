<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة تحت الإنشاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .icon {
            font-size: 45px;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #f8fafc;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .msg-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border: 1px dashed #475569;
            margin-top: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <i class="fa-solid fa-person-digging"></i>
        </div>
        <h1>عذراً، هذه الصفحة غير متاحة حالياً</h1>
        
        <div class="msg-box">
            <p>• هذه الصفحة تحت الإنشاء ولم يتم الانتهاء منها بعد.</p>
            <p style="margin-top: 8px;">• محتوى الصفحة لسه ما اتكتبش.</p>
        </div>
    </div>
</body>
</html>
