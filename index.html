<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة تحت الإنشاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        /* أنيميشن الاهتزاز والحركة للوجو العامل */
        .icon {
            font-size: 50px;
            color: #38bdf8;
            margin-bottom: 20px;
            animation: workerAction 1.5s infinite ease-in-out;
        }

        @keyframes workerAction {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.12) translateY(-6px); }
        }

        h1 {
            font-size: 22px;
            color: #f8fafc;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .msg-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border: 1px dashed #475569;
            margin-top: 15px;
            text-align: right;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
        }

        /* زر Help العائم بالرابط الخاص بك */
        .floating-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            padding: 12px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease;
            z-index: 100;
            direction: ltr; /* لضبط شكل الأيقونة مع النص الإنجليزي */
        }
        .floating-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- أيقونة العامل المتحركة بأكشن تلقائي -->
        <div class="icon">
            <i id="workerIcon" class="fa-solid fa-person-walking"></i>
        </div>

        <h1>عذراً، هذه الصفحة غير متاحة حالياً</h1>
        
        <div class="msg-box">
            <p>• هذه الصفحة تحت الإنشاء ولم يتم الانتهاء منها بعد.</p>
            <p style="margin-top: 8px;">• محتوى الصفحة لسه ما اتكتبش.</p>
        </div>
    </div>

    <!-- زر Help بالرابط المطلوب -->
    <a href="https://S-h.s.gy" class="floating-btn" target="_blank">
        <i class="fa-solid fa-life-ring"></i> Help
    </a>

    <script>
        // تغيير أكشن العامل عبر الأيقونات تلقائياً من غير أي نصوص متغيرة
        const workerIcons = ['fa-person-walking', 'fa-hammer', 'fa-person-digging'];
        let currentIndex = 0;
        const workerEl = document.getElementById('workerIcon');

        setInterval(() => {
            currentIndex = (currentIndex + 1) % workerIcons.length;
            workerEl.className = `fa-solid ${workerIcons[currentIndex]}`;
        }, 2000);
    </script>
</body>
</html>
