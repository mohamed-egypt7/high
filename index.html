<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة تحت الإنشاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        /* تأثير الحركة والاهتزاز للوجو التفاعلي */
        .icon {
            font-size: 45px;
            color: #38bdf8;
            margin-bottom: 10px;
            animation: workBounce 1.2s infinite ease-in-out;
            transition: all 0.5s ease;
        }

        @keyframes workBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-4deg); }
        }

        /* نص الحالة المتحرك تحت اللوجو */
        #phaseText {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 20px;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-size: 22px;
            color: #f8fafc;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .msg-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border: 1px dashed #475569;
            margin-top: 15px;
            text-align: right;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
        }

        /* الزر التفاعلي العائم (زر هيلب) */
        .floating-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            padding: 12px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease;
            z-index: 100;
        }
        .floating-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- اللوجو التفاعلي المتحرك -->
        <div class="icon" id="animatedIcon">
            <i class="fa-solid fa-person-walking"></i>
        </div>
        <div id="phaseText">جاري وصول العامل للموقع...</div>

        <h1>عذراً، هذه الصفحة غير متاحة حالياً</h1>
        
        <div class="msg-box">
            <p>• هذه الصفحة تحت الإنشاء ولم يتم الانتهاء منها بعد.</p>
            <p style="margin-top: 8px;">• محتوى الصفحة لسه ما اتكتبش.</p>
        </div>
    </div>

    <!-- زر هيلب مزود بالرابط الخاص بك -->
    <a href="https://S-h.s.gy" class="floating-btn" target="_blank">
        <i class="fa-solid fa-life-ring"></i> هيلب
    </a>

    <script>
        // سيناريو حركة العامل والبناء (تفاعلي متكرر)
        const iconElement = document.querySelector('#animatedIcon i');
        const phaseText = document.getElementById('phaseText');
        
        const workPhases = [
            { icon: 'fa-person-walking', text: 'العامل في طريق الوصول للموقع...' },
            { icon: 'fa-hammer', text: 'جاري بناء وتأسيس هيكل الصفحة...' },
            { icon: 'fa-person-digging', text: 'العمل جاري وتجهيز المحتوى...' }
        ];
        
        let currentStep = 0;

        function runStoryAnimation() {
            // تأثير خفيف للاختفاء والظهور عند تغير المرحلة
            phaseText.style.opacity = 0;
            setTimeout(() => {
                iconElement.className = `fa-solid ${workPhases[currentStep].icon}`;
                phaseText.innerText = workPhases[currentStep].text;
                phaseText.style.opacity = 1;
                
                currentStep = (currentStep + 1) % workPhases.length;
            }, 300);
        }

        // يتغير المشهد كل 2.5 ثانية ويعيد نفسه باستمرار
        setInterval(runStoryAnimation, 2500);
    </script>
</body>
</html>
